name: Build site from source

on:
  push:
    branches: [main]
    paths: ["source/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        working-directory: source
      - run: npm run build
        working-directory: source
      - name: Publish the build at the site root
        run: |
          find . -maxdepth 1 -mindepth 1 ! -name source ! -name .git ! -name .github ! -name README.md ! -name .gitignore ! -name .nojekyll -exec rm -rf {} +
          cp -r source/dist/. .
          touch .nojekyll
      - name: Commit the built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!source/node_modules' ':!source/dist'
          git diff --cached --quiet || git commit -m "Build site from source"
          git push
